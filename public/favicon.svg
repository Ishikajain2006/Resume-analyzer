<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="64" height="64" rx="16" fill="#0c0714" />
  <rect width="64" height="64" rx="16" stroke="url(#glowGrad)" stroke-width="2" opacity="0.6" />

  <!-- Glowing Neural Geometric N / Hex Symbol -->
  <g filter="url(#neonBlur)">
    <!-- Central Hexagon / Node shape -->
    <path d="M22 18 L32 12 L42 18 L42 30 L32 36 L22 30 Z" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-linejoin="round" />
    <!-- Diagonal core cross / N connector -->
    <path d="M22 18 L42 46" stroke="url(#glowGrad)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Bottom Hexagon / Node -->
    <path d="M22 34 L32 28 L42 34 L42 46 L32 52 L22 46 Z" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Central glowing pulse orbs -->
    <circle cx="32" cy="32" r="3" fill="#ffffff" />
    <circle cx="22" cy="18" r="2.5" fill="#ec4899" />
    <circle cx="42" cy="46" r="2.5" fill="#06b6d4" />
    <circle cx="42" cy="18" r="2" fill="#c084fc" />
    <circle cx="22" cy="46" r="2" fill="#c084fc" />
  </g>
</svg>
